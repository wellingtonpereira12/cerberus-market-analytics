name: Deploy Automático na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar e Subir Container na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e Atualizar Projeto
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Atualizando Cerberus Market Analytics na VPS..."
            mkdir -p /root/cerberus-market
            cd /root/cerberus-market
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            echo "✅ [CI/CD] Deploy concluído com sucesso na porta 3150!"

